<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="./icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>とうろく | おこづかいバンク</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="theme-color" content="#ff8fab">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">  <!-- フォントCSSは非ブロック読み込み(回線不調時に白画面のまま待たされるのを防ぐ)。
       読み込み完了まではシステムフォントで即表示する -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="./css/base.css">
  <script>
    // 静的ファイルをService Workerで端末に保存し、回線不調でも白画面にしない
    // (開発時: localhost では登録しない)
    if ("serviceWorker" in navigator && !["localhost", "127.0.0.1"].includes(location.hostname)) {
      addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>カードをかくにんちゅう...</div>
    </div>

    <div id="confirm" class="hidden center" style="margin-top:40px">
      <div style="font-size:64px">🪪✨</div>
      <h1 id="welcome-name">...</h1>
      <p id="welcome-role" class="muted"></p>
      <div class="card" style="text-align:left">
        <p id="confirm-msg">この スマホ・タブレットを <b id="welcome-name2"></b> の たんまつとして とうろくするよ。いいかな?</p>
      </div>
      <button id="register-btn" class="btn btn-primary btn-big">とうろくする!</button>
    </div>

    <div id="done" class="hidden center" style="margin-top:40px">
      <div style="font-size:64px">🎉</div>
      <h1>とうろくかんりょう!</h1>
      <div class="card" style="text-align:left">
        <h3>📌 だいじなおねがい</h3>
        <p>この画面を <b>「ホームがめんに追加」</b> しておいてね。まいにち アイコンから ひらけるようになるよ。</p>
        <p class="muted">iPhone: 共有ボタン(□↑)→「ホーム画面に追加」<br>Android: メニュー(⋮)→「ホーム画面に追加」</p>
      </div>
      <button id="go-btn" class="btn btn-primary btn-big">はじめる!</button>
    </div>

    <div id="error" class="hidden center" style="margin-top:40px">
      <div style="font-size:64px">😢</div>
      <h1>とうろくできなかったよ</h1>
      <p id="error-msg" class="card"></p>
      <a class="btn btn-ghost" href="./index.html">さいしょにもどる</a>
    </div>
  </div>

  <script type="module">
    import { db, doc, getDoc, setFamilyId } from "./js/db.js";
    import { resolveIdentity, registerWithInvite } from "./js/auth.js";
    import { toast, withBusy, esc } from "./js/ui.js";
    import { ROLE_LABELS } from "./js/presets.js";

    const params = new URLSearchParams(location.search);
    const famId = params.get("f");
    const token = params.get("t");

    const show = (id) => {
      for (const s of ["loading", "confirm", "done", "error"]) {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      }
    };
    const fail = (msg) => {
      document.getElementById("error-msg").textContent = msg;
      show("error");
    };

    let destination = "./index.html";

    async function main() {
      if (!famId || !token) return fail("カードのじょうほうが たりないよ。QRコードを もういちど よみこんでね。");

      const existing = await resolveIdentity().catch(() => null);
      const invSnap = await getDoc(doc(db, "families", famId, "invites", token)).catch(() => null);
      const inv = invSnap?.exists() ? invSnap.data() : null;

      // 登録済み端末は原則そのまま「自分の画面」へ入場する。
      // 子のカード(reusable)は家族共通の入口を兼ねる: 子端末なら子ページ、親端末なら親ページ。
      // 「きりかえ」確認に進むのは、別メンバーの1回限り招待リンクを開いたときだけ
      // (リンクをわざわざ発行して開く=この端末を登録し直す意思表示。誤登録の修正に使う)
      if (
        existing && existing.familyId === famId
        && (!inv || inv.reusable || (inv.memberId === existing.memberId && inv.role === existing.role))
      ) {
        location.replace(existing.role === "child" ? "./child.html" : "./parent.html");
        return;
      }

      if (!inv) return fail("しょうたいけんが見つからないよ。おうちの人に そうだんしてね。");
      if (inv.revoked) return fail("このしょうたいけんは 使えなくなっているよ。おうちの人に そうだんしてね。");
      if (inv.expiresAt && inv.expiresAt.toDate() < new Date()) return fail("しょうたいけんの きげんが きれているよ。おうちの人に あたらしいものを もらってね。");

      // メンバー名は members から(登録前は読めないので invite の role 表示のみでも成立させる)
      setFamilyId(famId);
      let name = "";
      try {
        const mSnap = await getDoc(doc(db, "families", famId, "members", inv.memberId));
        if (mSnap.exists()) name = mSnap.data().name;
      } catch { /* 未登録端末は members を読めない場合がある */ }

      destination = inv.role === "child" ? "./child.html" : "./parent.html";

      // 別メンバーとして登録済みの端末: 誤操作で登録が変わらないよう必ず確認を挟む
      // (登録ボタンを押すと、いまの登録を外してから新しいメンバーとして登録し直す)
      if (existing) {
        let oldName = "とうろくずみのメンバー";
        try {
          const oldSnap = await getDoc(doc(db, "families", existing.familyId, "members", existing.memberId));
          if (oldSnap.exists()) oldName = oldSnap.data().name;
        } catch { /* 読めなければ汎用表示のまま */ }
        document.getElementById("welcome-name").textContent = "たんまつの きりかえ";
        document.getElementById("welcome-role").textContent = `とうろくの しゅるい: ${ROLE_LABELS[inv.role] ?? inv.role}`;
        document.getElementById("confirm-msg").innerHTML =
          `この たんまつは いま <b>${esc(oldName)}</b> の たんまつだよ。<br>` +
          `<b>${esc(name || ROLE_LABELS[inv.role] || "メンバー")}</b> の たんまつに きりかえる?`;
        document.getElementById("register-btn").textContent = "きりかえる!";
        show("confirm");
        return;
      }

      // 子のカード(再利用可トークン)は確認なしで自動登録し、そのままホームへ。
      // 親・祖父母用の1回限りリンクは誤って開いた瞬間に消費されないよう確認を挟む
      if (inv.reusable) {
        document.querySelector("#loading div:last-child").textContent = "とうろくちゅう...";
        show("loading");
        try {
          await registerWithInvite(famId, token);
          location.replace(destination);
        } catch (err) {
          console.error(err);
          fail(err.message || "エラーがおきたよ。もういちど よみこんでね。");
        }
        return;
      }

      document.getElementById("welcome-name").textContent = name ? `${name} さん、ようこそ!` : "ようこそ!";
      document.getElementById("welcome-name2").textContent = name || ROLE_LABELS[inv.role] || "メンバー";
      document.getElementById("welcome-role").textContent = `とうろくの しゅるい: ${ROLE_LABELS[inv.role] ?? inv.role}`;
      show("confirm");
    }

    document.getElementById("register-btn").addEventListener("click", (e) =>
      withBusy(e.target, async () => {
        try {
          await registerWithInvite(famId, token);
          show("done");
        } catch (err) {
          console.error(err);
          fail(err.message || "エラーがおきたよ。もういちど ためしてね。");
        }
      }),
    );
    document.getElementById("go-btn").addEventListener("click", () => location.replace(destination));

    main().catch((e) => {
      console.error(e);
      fail(e.message || "エラーがおきたよ");
    });
  </script>
</body>
</html>
